<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8fb">
<title>Demo · Tín hiệu câu trả lời 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8fb;--pink:#f8dce7;--rose:#d68ba5;--wine:#98516e;--plum:#704253;--line:#eccbd7;--muted:#9c7c89;--shadow:0 24px 70px #70425316;--serif:'Playfair Display',Georgia,serif;--sans:'Be Vietnam Pro',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 8%,#ffeaf1,transparent 36%),radial-gradient(ellipse at 90% 88%,#f4e0e9,transparent 38%),var(--bg);color:var(--plum);font-family:var(--sans)}.demo{width:min(740px,100%);padding:clamp(20px,5vw,48px);border:1px solid #f0d7e1;border-radius:30px;background:#fffdfbe8;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}.demo:before{content:"";position:absolute;inset:10px;border:1px solid #f4e2e9;border-radius:23px;pointer-events:none}.content{position:relative;z-index:1}.eyebrow{font-size:.65rem;font-weight:700;letter-spacing:.2em;color:#b17c91}.demo h1{font:500 clamp(1.8rem,5vw,2.6rem)/1.15 var(--serif);color:var(--wine);max-width:620px;margin:13px auto 10px;text-wrap:balance}.sub{color:var(--muted);font-size:.83rem;margin:0 auto 22px}.options{position:relative;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:0 auto;max-width:570px;padding:15px 8px 10px}.option{position:relative;border:1px solid var(--line);border-radius:999px;background:#fff;color:#81576a;padding:11px 17px;font:600 .8rem var(--sans);cursor:pointer;transition:background .2s,border-color .2s,color .2s,box-shadow .2s,transform .2s;touch-action:manipulation}.option:hover{background:#fff1f6;border-color:#dfa2b7;transform:translateY(-1px)}.option[disabled]{cursor:default}.option.selected{color:#8f4965;background:#f5dce6;border-color:#d68ba5;box-shadow:0 4px 16px #d68ba52b}.option.blocked{animation:wrong .38s ease-in-out 2;border-color:#d68ba5;box-shadow:0 0 0 4px #f7dce688}@keyframes wrong{25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}.option.yes-hint{animation:yesPulse 1.3s ease-in-out infinite;border-color:#db8cab;box-shadow:0 0 0 4px #f8dce7,0 0 23px #d98da966}@keyframes yesPulse{50%{transform:translateY(-2px);box-shadow:0 0 0 7px #f8dce7,0 0 28px #d98da988}}.next-cue{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:99px;background:#fff4f8;color:#ae6280;font-size:.59rem;font-weight:700;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .2s}.option.yes-hint .next-cue{opacity:1}.reaction{display:flex;align-items:center;gap:14px;width:min(470px,100%);min-height:96px;margin:10px auto 0;padding:10px 14px;text-align:left;border:1px solid #efdbe4;border-radius:18px;background:linear-gradient(120deg,#fffafd,#fff2f7);box-shadow:0 9px 24px #7042530b;animation:reveal .42s ease both}.reaction[hidden]{display:none!important}.reaction img{width:70px;height:76px;flex:none;object-fit:cover;object-position:center 32%;border:3px solid white;border-radius:14px;box-shadow:0 4px 15px #70425320;background:var(--pink)}.reaction-label{font-size:.58rem;letter-spacing:.15em;font-weight:700;color:#b17c91;margin:0 0 4px}.reaction p{margin:0;color:var(--wine);font-size:.8rem;line-height:1.55;font-weight:500}.reaction.success{justify-content:center;text-align:center;border-color:#e6c29e;background:linear-gradient(120deg,#fffaf0,#fff5f8)}.reaction.success p{font:500 1.25rem var(--serif)}@keyframes reveal{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}.reset{margin-top:17px;border:0;background:transparent;color:#ad8292;font:500 .7rem var(--sans);text-decoration:underline;text-underline-offset:3px;cursor:pointer}.reset:hover{color:var(--wine)}.hint{font-size:.66rem;color:#b399a4;margin-top:12px}.heart{position:fixed;z-index:5;pointer-events:none;color:#d17e9b;animation:floatHeart 1.2s ease-out forwards}@keyframes floatHeart{to{transform:translate(var(--dx),-110px) scale(.5) rotate(25deg);opacity:0}}button:focus-visible{outline:3px solid #d08aa5;outline-offset:3px}@media(max-width:480px){body{padding:12px}.demo{padding:25px 16px;border-radius:23px}.demo:before{inset:7px;border-radius:17px}.sub{font-size:.75rem;margin-bottom:14px}.options{gap:7px;padding-top:20px}.option{font-size:.73rem;padding:10px 12px}.reaction{gap:10px;padding:9px 10px;min-height:83px}.reaction img{width:58px;height:65px}.reaction p{font-size:.72rem}.reaction.success p{font-size:1.08rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="demo" aria-labelledby="question"><div class="content"><div class="eyebrow">DEMO TƯƠNG TÁC · MÓN QUÀ CUỐI</div><h1 id="question">Em có muốn để anh đưa em đi một buổi hẹn thật đặc biệt không? ♡</h1><p class="sub">Bấm thử từng lựa chọn để xem tín hiệu xuất hiện nhé.</p>
<div class="options" id="options"><button class="option" data-answer="think" type="button">Để em suy nghĩ</button><button class="option" data-answer="sad" type="button">Em đang dỗi</button><button class="option" data-answer="yes" type="button"><span class="next-cue">ĐÁP ÁN DỄ THƯƠNG NHẤT ↑</span>Dạ có ♡</button></div>
<div class="reaction" id="reaction" hidden aria-live="polite"><img id="reactionImage" alt="Jungkook phản ứng"><div><div class="reaction-label" id="reactionLabel">TÍN HIỆU NHỎ</div><p id="reactionText"></p></div></div>
<button class="reset" id="reset" type="button">Chơi lại demo</button><div class="hint">Lựa chọn chưa đúng sẽ rung nhẹ, đổi chỗ với “Dạ có” và hiện lời nhắn bên dưới.</div></div></main>
<script>
const portraits={think:'demo-assets/answer-think.png',sad:'demo-assets/answer-sad.png',yes:'demo-assets/answer-yes.png'};
const captions={think:'Hệ thống báo lỗi rồi bé ơi! Đáp án đáng yêu nhất nằm ở nút “Dạ có” kìa 🤭💗',sad:'Dỗi anh cũng được, nhưng đừng dỗi buổi hẹn nha… Anh còn phải dẫn công chúa đi chơi nữa mà 🥹💕',yes:'Anh yêu em nhiều lắm ♡'};
const buttons=[...document.querySelectorAll('.option')],options=document.getElementById('options'),reaction=document.getElementById('reaction');
function switchWithYes(button){const yes=options.querySelector('[data-answer="yes"]');if(!yes||yes===button)return;const a=button.getBoundingClientRect(),b=yes.getBoundingClientRect(),dx=b.left-a.left,dy=b.top-a.top,marker=document.createComment('swap');options.replaceChild(marker,button);options.replaceChild(button,yes);options.replaceChild(yes,marker);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;button.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});yes.animate([{transform:`translate(${-dx}px,${-dy}px)`},{transform:'none'}],{duration:320,easing:'ease-out'})}
function burst(){for(let i=0;i<16;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%3?'♡':'✦';h.style.left=(innerWidth/2+Math.random()*100-50)+'px';h.style.top=(innerHeight/2+Math.random()*40-20)+'px';h.style.setProperty('--dx',(Math.random()*120-60)+'px');document.body.append(h);setTimeout(()=>h.remove(),1300)}}
buttons.forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.answer;buttons.forEach(x=>x.classList.remove('selected','blocked','yes-hint'));if(key==='yes'){button.classList.add('selected');document.getElementById('reactionImage').src=portraits.yes;document.getElementById('reactionImage').alt='Jungkook vui vẻ nháy mắt';document.getElementById('reactionLabel').textContent='ĐÚNG RỒI ĐÓ';document.getElementById('reactionText').textContent=captions.yes;reaction.classList.add('success');reaction.hidden=false;reaction.animate([{opacity:0,transform:'translateY(8px) scale(.98)'},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'});burst();return}button.classList.add('blocked');const yes=options.querySelector('[data-answer="yes"]');yes.classList.add('yes-hint');switchWithYes(button);document.getElementById('reactionImage').src=portraits[key];document.getElementById('reactionImage').alt=key==='sad'?'Jungkook đang khóc vì em dỗi':'Jungkook đang suy nghĩ';document.getElementById('reactionLabel').textContent='TÍN HIỆU NHỎ';document.getElementById('reactionText').textContent=captions[key];reaction.classList.remove('success');reaction.hidden=false;reaction.animate([{opacity:0,transform:'translateY(8px) scale(.98)'},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'});setTimeout(()=>button.classList.remove('blocked'),900)}));
document.getElementById('reset').addEventListener('click',()=>{const order=['think','sad','yes'];order.forEach(key=>options.append(buttons.find(b=>b.dataset.answer===key)));buttons.forEach(b=>b.classList.remove('selected','blocked','yes-hint'));reaction.hidden=true;reaction.classList.remove('success');document.getElementById('reactionImage').removeAttribute('src')});
</script>
</body>
</html>
